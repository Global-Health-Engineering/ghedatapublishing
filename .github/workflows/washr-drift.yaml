# washr API drift check (#12): installs washr from CRAN and verifies that every
# washr function the guide's R chunks call is still exported, with the
# arguments the guide passes. Reports the CRAN version against WASHR_VERSION.
name: washr-drift

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install washr from CRAN
        run: Rscript -e 'install.packages("washr")'
      - name: Drift check
        run: Rscript scripts/washr_drift.R '*.qmd'
